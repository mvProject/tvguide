[plugins]
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
android-kotlin = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
android-application = { id = "com.android.application", version.ref = "gradle" }
firebase-crashlitycs = { id = "com.google.firebase.crashlytics", version.ref = "crashlyticsGradle" }
gms-googleServices = { id = "com.google.gms.google-services", version.ref = "googleServices" }
#versions = { id = "com.github.ben-manes.versions", version.ref = "versionsPlugin" }
#ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktLint" }
kotlin-parcelize = { id = "org.jetbrains.kotlin.plugin.parcelize", version.ref = "kotlin" }
kotlinx-serialization-plugin = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }

[libraries]
# Core
androidx-core = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }
androidx-material = { module = "com.google.android.material:material", version.ref = "androidx-material" }
androidx-annotation = { module = "androidx.annotation:annotation", version.ref = "androidx-annotation" }

timber = { module = "com.jakewharton.timber:timber", version.ref = "timber" }

# Preference
dataStore = { module = "androidx.datastore:datastore-preferences", version.ref = "dataStore" }

# Room Database
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }

# Coroutine
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines-core" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinx-coroutines-android" }

# Serialization
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization-json" }

# Permissions
accompanist-permissions = { module = "com.google.accompanist:accompanist-permissions", version.ref = "accompanist-permissions" }

# DateTime
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinx-datetime" }

# Compose
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "compose-bom" }
